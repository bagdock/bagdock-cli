name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'bin/**'
      - 'package.json'
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip npm publish)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI
        run: bun run build

      - name: Verify dist output
        run: |
          test -f dist/bagdock.js || (echo "Build failed: dist/bagdock.js not found" && exit 1)
          head -1 dist/bagdock.js | grep -q "#!/usr/bin/env node" || (echo "Missing shebang" && exit 1)
          echo "Build OK — $(wc -c < dist/bagdock.js) bytes"

      # Idempotency guard: this workflow fires on both push-to-main and the v*
      # tag (and the team also cuts GitHub releases), so the same version can be
      # triggered twice. Skip publish when that version already exists on npm so
      # the duplicate run goes green instead of failing "cannot publish over the
      # previously published version".
      - name: Check if version already published
        id: version_check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VER} is already on npm — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: ${{ !inputs.dry_run && steps.version_check.outputs.exists == 'false' }}
        run: npx npm@latest publish --provenance --access public

      - name: Skip — version already published
        if: ${{ !inputs.dry_run && steps.version_check.outputs.exists == 'true' }}
        run: echo "Version ${{ steps.version_check.outputs.version }} already on npm; nothing to publish."

      - name: Dry run — would publish
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run
